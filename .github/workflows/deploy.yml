name: Deploy

# Builds the Astro site and publishes dist/ to the gh-pages branch.
# GitHub Pages must be configured as: Source = "Deploy from a branch", gh-pages / root.
# (The branch model is required because pr-preview-action publishes previews into
# subdirectories of the same branch; the artifact-based actions/deploy-pages cannot
# coexist with that.)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_todas:
        description: "IndexNow: enviar todas as URLs, não só as que mudaram"
        type: boolean
        default: false

permissions:
  contents: write

# Two locks, so a preview can never cancel a deploy (it did on the merge of #18):
# - Run level, deploys only: a newer push to main replaces a deploy still pending.
#   That cancel is harmless — the newer run builds a main that contains the older push.
# - Job level, shared with preview.yml: one writer on gh-pages at a time. `queue: max`
#   lets runs wait in line instead of replacing each other (the default keeps a single
#   pending slot, and whoever arrives last cancels whoever was waiting).
concurrency:
  group: gh-pages-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-write
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> comes from git log (scripts/lastmod.mjs),
          # and a shallow clone would give every page the same date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Saves the sitemap that is live now, so the step after publishing can tell which
      # pages this deploy changed. See scripts/indexnow.mjs.
      - name: IndexNow — sitemap anterior
        # Runs before publishing, so it must never block or fail the deploy.
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow.mjs snapshot

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Previews live under pr-preview/ on this same branch — don't wipe them.
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: IndexNow — avisar buscadores
        # Never fails the deploy: the site is already published at this point.
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/indexnow.mjs submit ${{ inputs.indexnow_todas && '--todas' || '' }}
