name: PR Preview

# Publishes each PR to https://terranode.com.br/pr-preview/pr-<N>/ and removes it on close.
# Previews are excluded from indexing by robots.txt and by a noindex meta tag that
# Base.astro emits whenever the build's base path starts with /pr-preview.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# Two locks (see deploy.yml):
# - Run level, per PR: a newer event of the same PR replaces one still pending, so only
#   the latest push gets built and the cleanup on close never overtakes a build.
# - Job level, shared with deploy.yml: one writer on gh-pages at a time, waiting in line.
concurrency:
  group: gh-pages-preview-${{ github.event.number }}

jobs:
  preview:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-write
      queue: max
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      - name: Build with the preview base path
        if: github.event.action != 'closed'
        env:
          PREVIEW_BASE: /pr-preview/pr-${{ github.event.number }}
        run: |
          npm run build
          # CNAME only means anything at the branch root, and the deploy action
          # preserves it on cleanup — so shipping it would leave one stray file
          # behind per closed PR.
          rm -f dist/CNAME

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
