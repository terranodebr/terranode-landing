name: AI Review (Auto)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ai-review-auto-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: PR-Agent review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR-Agent review
        uses: docker://pragent/pr-agent:0.42.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK__KEY: ${{ secrets.DEEPSEEK_API_KEY }}
