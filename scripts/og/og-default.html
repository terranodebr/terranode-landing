<!DOCTYPE html>
<!--
  Fonte da imagem de compartilhamento (public/og-default.jpg), 1200×630.
  Para regerar depois de editar, da raiz do repositório:
    node scripts/og/gerar.mjs
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Archivo", sans-serif; color: #EEF3F1; background: #0C1312; }
  .og { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px 60px; display: flex; flex-direction: column; isolation: isolate; }
  /* Orange glow from the top right and a dot grid that fades out, as in the home v2 hero. */
  .og::before { content: ""; position: absolute; inset: 0; z-index: -2; background: radial-gradient(rgba(255, 255, 255, 0.09) 1.2px, transparent 1.4px) 0 0 / 24px 24px; -webkit-mask-image: radial-gradient(70% 90% at 80% 10%, #000, transparent 75%); }
  .og::after { content: ""; position: absolute; right: -220px; top: -260px; z-index: -1; width: 900px; height: 700px; background: radial-gradient(closest-side, rgba(255, 102, 41, 0.32), rgba(255, 102, 41, 0.08) 60%, transparent); }
  /* Contour lines, like a topographic map. */
  .curvas { position: absolute; right: -30px; top: 40px; z-index: -1; width: 700px; }
  .marca { height: 56px; width: auto; align-self: flex-start; }
  h1 { margin: auto 0 0; font-weight: 800; font-size: 84px; line-height: 0.98; letter-spacing: -0.035em; }
  h1 span { display: block; color: #FF6629; }
  .provas { display: flex; gap: 12px; margin-top: 40px; }
  .provas span { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; border-radius: 100px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(22, 32, 31, 0.8); font-weight: 600; font-size: 20px; }
  .provas span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #FF6629; }
</style>
</head>
<body>
<div class="og">
  <svg class="curvas" viewBox="0 0 760 300" fill="none" aria-hidden="true">
    <g stroke="rgba(255,255,255,0.09)" stroke-width="2">
      <path d="M60 60 C 170 30, 250 90, 370 50 S 590 -10, 760 20"/>
      <path d="M20 120 C 150 80, 240 150, 370 110 S 600 40, 760 70"/>
      <path d="M0 180 C 140 140, 230 210, 360 170 S 600 100, 760 130"/>
      <path d="M40 240 C 170 210, 260 270, 390 230 S 620 160, 760 190"/>
      <path d="M120 300 C 240 270, 320 320, 440 290 S 640 230, 760 250"/>
    </g>
    <g stroke="#FF6629" stroke-width="4" stroke-dasharray="14 12" stroke-linecap="round">
      <path d="M230 172 L 400 104 L 540 150 L 680 64"/>
    </g>
    <g fill="#FF6629">
      <circle cx="230" cy="172" r="13"/><circle cx="400" cy="104" r="13"/><circle cx="540" cy="150" r="13"/><circle cx="680" cy="64" r="13"/>
    </g>
  </svg>
  <img class="marca" src="../../public/terranode-logo.svg" alt="TerraNode">
  <h1>Do campo ao mapa,<span>sem perder um ponto.</span></h1>
  <div class="provas">
    <span>100% offline</span>
    <span>ArcGIS Online e Enterprise</span>
    <span>Criptografia nas duas pontas</span>
  </div>
</div>
</body>
</html>
