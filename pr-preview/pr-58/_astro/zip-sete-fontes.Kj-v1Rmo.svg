<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 748" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="terranode-zip-sete-fontes-title terranode-zip-sete-fontes-desc" id="terranode-zip-sete-fontes-root">
  <title id="terranode-zip-sete-fontes-title">Do ZIP às sete fontes de dados</title>
  <desc id="terranode-zip-sete-fontes-desc">Um arquivo ZIP com quatro Shapefiles, uma planilha de duas abas e um GeoTIFF é separado pelo TerraNode em sete fontes de dados independentes; o PDF de metadados é ignorado.</desc>
  <defs>
    <style>
      #terranode-zip-sete-fontes-root { --ink: #16201f;
      --muted: #5b6663;
      --soft: #8a928f;
      --accent: #ff6629;
      --green: #2e9e5b;
      --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
      --mono: 'Roboto Mono', 'SFMono-Regular', Consolas, monospace; }
      #terranode-zip-sete-fontes-root { color: var(--ink); font-family: var(--sans); }
      #terranode-zip-sete-fontes-root .eb { font: 600 10px var(--sans); letter-spacing: 0.09em; fill: var(--soft); }
      #terranode-zip-sete-fontes-root .title { font: 700 25px var(--sans); letter-spacing: -0.02em; fill: var(--ink); }
      #terranode-zip-sete-fontes-root .sub { font: 500 12.5px var(--sans); fill: var(--muted); }
      #terranode-zip-sete-fontes-root .file-name { font: 500 14px var(--mono); fill: var(--ink); }
      #terranode-zip-sete-fontes-root .chip-name { font: 500 12.5px var(--mono); fill: var(--ink); }
      #terranode-zip-sete-fontes-root .chip-sub { font: 500 10px var(--sans); fill: var(--muted); }
      #terranode-zip-sete-fontes-root .hub-name { font: 600 15px var(--sans); fill: var(--ink); }
      #terranode-zip-sete-fontes-root .hub-sub { font: 500 11.5px var(--sans); fill: var(--muted); }
      #terranode-zip-sete-fontes-root .count { font: 700 40px var(--sans); fill: var(--accent); }
      #terranode-zip-sete-fontes-root .count-label { font: 600 12px var(--sans); fill: var(--ink); }
      #terranode-zip-sete-fontes-root .count-sub { font: 500 10.5px var(--sans); fill: var(--muted); }
      #terranode-zip-sete-fontes-root .src-name { font: 500 12.5px var(--mono); fill: var(--ink); }
      #terranode-zip-sete-fontes-root .src-type { font: 600 10px var(--sans); fill: var(--muted); }
      #terranode-zip-sete-fontes-root .note { font: 500 10.5px var(--sans); fill: var(--muted); }
      #terranode-zip-sete-fontes-root .tag { font: 700 9.5px var(--sans); letter-spacing: 0.07em; fill: var(--green); }
      #terranode-zip-sete-fontes-root .arrow-label { font: 500 9px var(--mono); letter-spacing: 0.06em; fill: var(--muted); }
    </style>
    <marker id="terranode-zip-sete-fontes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a928f"/>
    </marker>
    <marker id="terranode-zip-sete-fontes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6629"/>
    </marker>
  </defs>

  <rect width="560" height="748" fill="#fafaf9"/>

  <text class="eb" x="32" y="40">IMPORTAÇÃO NO CATÁLOGO</text>
  <text class="title" x="32" y="70">Do ZIP às sete fontes de dados</text>
  <text class="sub" x="32" y="92">O TerraNode abre o pacote, reconhece cada conteúdo e separa as fontes.</text>

  <!-- ZIP input -->
  <rect x="32" y="108" width="496" height="160" rx="10" fill="#ffffff" stroke="#e2e0db"/>
  <path d="M48 126 H58 L61 130 H72 V144 H48 Z" fill="#fff7f3" stroke="#ff6629"/>
  <text class="eb" x="82" y="132">ARQUIVO ENVIADO</text>
  <text class="file-name" x="82" y="151">dados-projeto.zip</text>
  <line x1="48" y1="166" x2="512" y2="166" stroke="#e2e0db"/>

  <rect x="48" y="174" width="228" height="40" rx="6" fill="#f4f2ee"/>
  <text class="chip-name" x="62" y="191">ibge/</text>
  <text class="chip-sub" x="62" y="206">4 Shapefiles</text>

  <rect x="284" y="174" width="228" height="40" rx="6" fill="#f4f2ee"/>
  <text class="chip-name" x="298" y="191">brasil.xlsx</text>
  <text class="chip-sub" x="298" y="206">2 abas</text>

  <rect x="48" y="220" width="228" height="40" rx="6" fill="#f4f2ee"/>
  <text class="chip-name" x="62" y="237">imagem-orbital.tif</text>
  <text class="chip-sub" x="62" y="252">GeoTIFF</text>

  <rect x="284" y="220" width="228" height="40" rx="6" fill="#ffffff" stroke="#e2e0db" stroke-dasharray="4 3"/>
  <text class="chip-name" x="298" y="237" fill="#8a928f">metadados.pdf</text>
  <text class="chip-sub" x="298" y="252" fill="#8a928f">ignorado</text>

  <!-- Envio -->
  <path d="M280 268 V300" fill="none" stroke="#ff6629" stroke-width="1.5" marker-end="url(#terranode-zip-sete-fontes-arrow-accent)"/>
  <text class="arrow-label" x="290" y="289">ENVIO</text>

  <!-- Processing hub -->
  <rect x="32" y="304" width="496" height="92" rx="10" fill="#fff7f3" stroke="#ff6629" stroke-width="1.5"/>
  <rect x="48" y="318" width="88" height="18" rx="3" fill="#ff6629"/>
  <text x="92" y="331" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="8.5" font-weight="500" letter-spacing="0.08em" fill="#ffffff">TERRANODE</text>
  <text class="hub-name" x="48" y="356">Abre e reconhece</text>
  <text class="hub-sub" x="48" y="374">camadas, tabelas, abas e raster</text>
  <line x1="318" y1="318" x2="318" y2="382" stroke="#f1c7b7"/>
  <text class="count" x="340" y="372">7</text>
  <text class="count-label" x="378" y="352">fontes de dados</text>
  <text class="count-sub" x="378" y="368">processadas uma a uma</text>

  <path d="M280 396 V428" fill="none" stroke="#8a928f" stroke-width="1" marker-end="url(#terranode-zip-sete-fontes-arrow)"/>

  <text class="eb" x="32" y="450">FONTES NO TERRANODE</text>

  <!-- Source: brasil-capitais -->
  <g>
    <rect x="32" y="460" width="240" height="50" rx="6" fill="#ffffff" stroke="#e2e0db"/>
    <circle cx="54" cy="485" r="5" fill="#ff6629"/>
    <text class="src-name" x="72" y="482">brasil-capitais</text>
    <text class="src-type" x="72" y="498">Ponto</text>
  </g>

  <!-- Source: brasil-estados -->
  <g>
    <rect x="288" y="460" width="240" height="50" rx="6" fill="#ffffff" stroke="#e2e0db"/>
    <rect x="49" y="480" width="10" height="10" rx="2" fill="none" stroke="#8a928f" stroke-dasharray="2 2"/>
    <text class="src-name" x="328" y="482">brasil-estados</text>
    <text class="src-type" x="328" y="498">Sem geometria</text>
  </g>

  <!-- Source: eco_ext_mineral_a -->
  <g>
    <rect x="32" y="518" width="240" height="50" rx="6" fill="#ffffff" stroke="#e2e0db"/>
    <path d="M48 536 L52 519 L62 516 L66 532 L58 541 Z" fill="#e9f5ee" stroke="#2e9e5b"/>
    <text class="src-name" x="72" y="540">eco_ext_mineral_a</text>
    <text class="src-type" x="72" y="556">Polígono</text>
  </g>

  <!-- Source: enc_hidreletrica_p -->
  <g>
    <rect x="288" y="518" width="240" height="50" rx="6" fill="#ffffff" stroke="#e2e0db"/>
    <circle cx="54" cy="543" r="5" fill="#2e9e5b"/>
    <text class="src-name" x="328" y="540">enc_hidreletrica_p</text>
    <text class="src-type" x="328" y="556">Ponto</text>
  </g>

  <!-- Source: enc_trecho_energia_l -->
  <g>
    <rect x="32" y="576" width="240" height="50" rx="6" fill="#ffffff" stroke="#e2e0db"/>
    <path d="M47 609 L54 594 L63 610" fill="none" stroke="#ff6629" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="src-name" x="72" y="598">enc_trecho_energia_l</text>
    <text class="src-type" x="72" y="614">Linha</text>
  </g>

  <!-- Source: fer_trecho_ferroviario_l -->
  <g>
    <rect x="288" y="576" width="240" height="50" rx="6" fill="#ffffff" stroke="#e2e0db"/>
    <path d="M305 609 L311 594 L320 610" fill="none" stroke="#5b6663" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="src-name" x="328" y="598">fer_trecho_ferroviario_l</text>
    <text class="src-type" x="328" y="614">Linha</text>
  </g>

  <!-- Source: imagem-orbital-recorte -->
  <g>
    <rect x="32" y="634" width="240" height="50" rx="6" fill="#ffffff" stroke="#e2e0db"/>
    <rect x="48" y="651" width="13" height="13" rx="2" fill="#e9f5ee" stroke="#2e9e5b"/>
    <path d="M48 657.5 H61 M54.5 651 V664" stroke="#2e9e5b" stroke-width="0.8" opacity="0.65"/>
    <text class="src-name" x="72" y="656">imagem-orbital-recorte</text>
    <text class="src-type" x="72" y="672">Raster</text>
  </g>

  <line x1="32" y1="704" x2="528" y2="704" stroke="#e2e0db"/>
  <text class="note" x="32" y="724">Cada fonte pode receber estilo e seguir para um projeto de campo.</text>
  <text class="tag" x="528" y="724" text-anchor="end">7 FONTES INDEPENDENTES</text>
</svg>
